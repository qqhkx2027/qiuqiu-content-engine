name: Auto Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'content/公众号/**'
      - 'site/**'
      - '.github/workflows/sync-publish.yml'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract article meta
        run: python content/公众号/extract_articles.py

      - name: Build site
        run: |
          cd site
          node build3.mjs
          node make_topics.mjs
          node build_extra.mjs
          node build_intel.mjs
          node build_atoms.mjs
          node linkcheck.mjs

      - name: Commit generated docs if changed
        run: |
          git config user.name "qiuqiu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs site content/公众号/extract_articles.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto rebuild from content [skip ci]"
            git push origin main
          fi

